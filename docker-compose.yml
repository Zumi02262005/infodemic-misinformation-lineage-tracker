# Optional: run PostgreSQL in Docker instead of installing it.
#   docker compose up -d      start (data is kept in a named volume)
#   docker compose down       stop
#   docker compose down -v    stop and delete the data
# The credentials match the default DATABASE_URL in server/.env.example.
# If something else already uses port 5432, change "5432:5432" to "5433:5432"
# and use port 5433 in DATABASE_URL.
services:
  postgres:
    image: postgres:16-alpine
    container_name: infodemic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infodemic
    ports:
      - "5432:5432"
    volumes:
      - infodemic-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infodemic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  infodemic-pgdata:
